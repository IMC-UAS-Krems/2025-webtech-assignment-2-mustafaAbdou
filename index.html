<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse our delicious food menu and place your order">
    <title>Food | Order Fresh & Delicious</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark" role="navigation" aria-label="Main navigation">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="imgs/logo.png" alt="" width="30" height="24" aria-hidden="true">
                    <span>Food</span>
                </a>
                
                <button 
                    class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#mainNav"
                    aria-controls="mainNav" 
                    aria-expanded="false" 
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="site-content">
        <section class="menu-browser container-fluid mt-4" aria-label="Food menu">
            <div class="row">
                
                <!-- Categories Sidebar -->
                <aside class="col-12 col-md-2 mb-3">
                    <nav class="category-nav card d-none d-md-block" aria-label="Food categories">
                        <div class="card-header bg-secondary text-white">
                            <h2 class="h5 mb-0">
                                <i class="fa-solid fa-utensils me-2" aria-hidden="true"></i>
                                Food Categories
                            </h2>
                        </div>
                        <ul class="list-group list-group-flush" id="categoryFilter" role="tablist">
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action active" data-category="all" role="tab" aria-selected="true">
                                    <i class="fa-solid fa-list me-2" aria-hidden="true"></i>All
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="burgers" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-burger me-2" aria-hidden="true"></i>Burgers
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="pizza" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-pizza-slice me-2" aria-hidden="true"></i>Pizza
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="salads" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-leaf me-2" aria-hidden="true"></i>Salads
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="desserts" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-ice-cream me-2" aria-hidden="true"></i>Desserts
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="beverages" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-martini-glass-citrus me-2" aria-hidden="true"></i>Beverages
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="appetizers" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-bowl-food me-2" aria-hidden="true"></i>Appetizers
                                </a>
                            </li>
                            <li role="presentation">
                                <a href="#" class="list-group-item list-group-item-action" data-category="seafood" role="tab" aria-selected="false">
                                    <i class="fa-solid fa-fish me-2" aria-hidden="true"></i>Seafood
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <!-- Mobile Categories -->
                    <div class="d-md-none accordion" id="mobileCategoryAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button 
                                    class="accordion-button collapsed" 
                                    type="button"
                                    data-bs-toggle="collapse" 
                                    data-bs-target="#mobileCategoryPanel" 
                                    aria-expanded="false"
                                    aria-controls="mobileCategoryPanel">
                                    <i class="fa-solid fa-utensils" aria-hidden="true"></i>
                                    <span class="visually-hidden">Categories</span>
                                </button>
                            </h2>
                            <div id="mobileCategoryPanel" class="accordion-collapse collapse">
                                <div class="accordion-body p-0">
                                    <ul class="list-group list-group-flush" id="categoryFilterMobile">
                                        <li><a href="#" class="list-group-item list-group-item-action active" data-category="all"><i class="fa-solid fa-list" aria-hidden="true"></i><span class="visually-hidden">All</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="burgers"><i class="fa-solid fa-burger" aria-hidden="true"></i><span class="visually-hidden">Burgers</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="pizza"><i class="fa-solid fa-pizza-slice" aria-hidden="true"></i><span class="visually-hidden">Pizza</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="salads"><i class="fa-solid fa-leaf" aria-hidden="true"></i><span class="visually-hidden">Salads</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="desserts"><i class="fa-solid fa-ice-cream" aria-hidden="true"></i><span class="visually-hidden">Desserts</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="beverages"><i class="fa-solid fa-martini-glass-citrus" aria-hidden="true"></i><span class="visually-hidden">Beverages</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="appetizers"><i class="fa-solid fa-bowl-food" aria-hidden="true"></i><span class="visually-hidden">Appetizers</span></a></li>
                                        <li><a href="#" class="list-group-item list-group-item-action" data-category="seafood"><i class="fa-solid fa-fish" aria-hidden="true"></i><span class="visually-hidden">Seafood</span></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Products Grid -->
                <section class="col-12 col-md-8 mb-3" aria-label="Menu items">
                    <div class="row g-3" id="card_container" role="tabpanel">
                        <!-- JS populates product cards -->
                    </div>
                </section>

                <!-- Order Summary Sidebar -->
                <aside class="col-12 col-md-2 d-none d-md-block">
                    <div class="order-summary card sticky-top" style="top: 1rem;">
                        <div class="card-header bg-secondary text-white">
                            <h2 class="h5 mb-0">
                                <i class="fa-solid fa-list-check me-2" aria-hidden="true"></i>
                                Order Summary
                            </h2>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush" id="order_summary" aria-live="polite">
                                <!-- JS populates order items -->
                            </ul>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <!-- Mobile Cart FAB -->
    <div class="mobile-cart-trigger d-md-none">
        <button 
            class="btn btn-secondary rounded-circle p-3 shadow-lg" 
            type="button" 
            data-bs-toggle="offcanvas" 
            data-bs-target="#mobileCartDrawer"
            aria-label="Open cart">
            <i class="fa-solid fa-shopping-cart fa-lg" aria-hidden="true"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge">
                0
                <span class="visually-hidden">items in cart</span>
            </span>
        </button>
    </div>

    <!-- Mobile Cart Drawer -->
    <div class="offcanvas offcanvas-end d-md-none" tabindex="-1" id="mobileCartDrawer" aria-labelledby="mobileCartTitle">
        <div class="offcanvas-header bg-secondary text-white">
            <h2 class="offcanvas-title h5" id="mobileCartTitle">
                <i class="fa-solid fa-list-check me-2" aria-hidden="true"></i>
                Order Summary
            </h2>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close cart"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="list-group list-group-flush" id="mobile_order_summary" aria-live="polite">
                <!-- JS populates mobile order items -->
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
